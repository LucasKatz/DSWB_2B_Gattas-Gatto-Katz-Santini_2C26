<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · KineVida</title>
  <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
  <main class="centrado">
    <div class="tarjeta">
      <h1>KineVida</h1>
      <p class="subtitulo">Inicie sesión para continuar</p>

      <div id="alerta" class="alerta alerta-error" role="alert" hidden></div>

      <form id="formulario">
        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button id="boton" class="boton boton-completo" type="submit">Iniciar sesión</button>
      </form>
    </div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
